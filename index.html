<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Level-Up · 60-Day Challenge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --bg:#f5f4fc; --card:#ffffff; --ink:#221f55; --mute:#75739e; --line:#e9e6f7;
  --f:#6c5ce7; --f-soft:#ede9fe; --pink:#ec4899; --green:#10b981; --orange:#f97316; --blue:#0ea5e9; --gold:#f59e0b;
  --shadow:0 8px 24px rgba(84,70,180,.08); --shadow-lg:0 14px 36px rgba(84,70,180,.14);
  --r:18px; --r-lg:22px;
  --tile-purple:#ede9fe; --tile-orange:#ffedd5; --tile-gold:#fef3c7; --tile-blue:#dbeafe;
  --side-bg:#fdfcff;
}
:root[data-theme="dark"]{
  --bg:#12102a; --card:#1c1940; --ink:#f1efff; --mute:#a09fc7; --line:#2e2a5e;
  --f:#8b7cf7; --f-soft:#2b2561; --shadow:0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 14px 36px rgba(0,0,0,.45);
  --tile-purple:#332c66; --tile-orange:#4a2f1d; --tile-gold:#453517; --tile-blue:#1d3153;
  --side-bg:#181538;
}
*,*:before,*:after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;font-weight:600;transition:background .3s,color .3s}
button,textarea,input{font-family:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
img{-webkit-user-drag:none}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--pink) 65%,transparent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.bar{height:9px;border-radius:99px;background:color-mix(in srgb,var(--mute) 18%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--k,var(--f));transition:width .45s cubic-bezier(.2,.8,.2,1)}
.mute{color:var(--mute)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ sidebar ============ */
#sidebar{position:fixed;inset:0 auto 0 0;width:266px;background:var(--side-bg);border-right:1px solid var(--line);padding:22px 16px 18px;display:flex;flex-direction:column;gap:8px;z-index:30;transition:background .3s}
.brand{display:flex;align-items:center;gap:12px;padding:2px 6px 14px}
.brand img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(120,90,200,.25))}
.brand b{display:block;font-size:1.32rem;font-weight:900;line-height:1.1}
.brand small{color:var(--mute);font-weight:700;font-size:.8rem}
#nav{display:flex;flex-direction:column;gap:6px}
#nav button{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;border-radius:14px;background:none;font-size:.98rem;font-weight:700;color:var(--ink);text-align:left;transition:background .2s,color .2s}
#nav button svg{width:21px;height:21px;flex:none;color:var(--mute);transition:color .2s}
#nav button:hover{background:color-mix(in srgb,var(--f) 8%,transparent)}
#nav button.on{background:var(--f-soft);color:var(--f)}
#nav button.on svg{color:var(--f)}
.smas{margin-top:auto;border-radius:20px;padding:18px 16px 20px;position:relative;overflow:hidden;background:linear-gradient(160deg,#ffe4ef 0%,#eee7ff 55%,#ffe9d9 100%);text-align:center;box-shadow:var(--shadow)}
:root[data-theme="dark"] .smas{background:linear-gradient(160deg,#3a2750 0%,#2b2257 55%,#43264d 100%)}
.smas .plant{position:absolute;left:9px;top:30px;width:44px;height:44px;object-fit:contain;opacity:.95;z-index:0}
.smas .bear{width:118px;height:100px;object-fit:contain;margin:0 auto 6px;position:relative;filter:drop-shadow(0 8px 12px rgba(120,80,180,.28))}
.smas b{display:block;font-size:1.05rem;font-weight:900;line-height:1.25;position:relative;z-index:1}
:root[data-theme="dark"] .smas b{color:#f1efff}
.smas small{display:block;color:var(--mute);font-weight:700;font-size:.8rem;margin-top:3px;position:relative;z-index:1}
:root[data-theme="dark"] .smas small{color:#c9c2ef}

/* ============ main / topbar ============ */
.main{margin-left:266px;padding:26px clamp(18px,3vw,40px) 46px;max-width:1330px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.hl h1{font-size:clamp(1.5rem,2.6vw,1.85rem);font-weight:900}
.hl p{color:var(--mute);font-size:.9rem;font-weight:700;margin-top:2px}
.tools{margin-left:auto;display:flex;align-items:center;gap:12px}
.search{position:relative;width:min(400px,36vw)}
.search>svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute);pointer-events:none}
.search input{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:0 62px 0 42px;font:inherit;font-weight:600;box-shadow:var(--shadow)}
.search input::placeholder{color:var(--mute)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:8px;padding:3px 8px;font:700 .72rem/1 inherit}
.sres{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:6px;z-index:60;display:none;max-height:330px;overflow:auto}
.sres.open{display:block;animation:pop .15s}
.sres button{display:flex;gap:11px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 11px;border-radius:12px}
.sres button:hover{background:var(--f-soft)}
.sres .si{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--f-soft);color:var(--f);font-size:.8rem;font-weight:900}
.sres .si img{width:22px;height:22px;object-fit:contain}
.sres .si svg{width:18px;height:18px}
.sres b{display:block;font-size:.9rem}.sres small{display:block;color:var(--mute);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:290px}
.sres .none{padding:12px;color:var(--mute);text-align:center;font-size:.86rem}
.ibtn{position:relative;width:46px;height:46px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
.ibtn svg{width:20px;height:20px;color:var(--ink)}
.ibtn .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:#ef4444;border:2px solid var(--card)}
.acct{position:relative;display:flex;align-items:center;gap:4px}
.avatar{width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,#a99bf5,#7c6cf0);color:#fff;font-weight:900;font-size:1rem;box-shadow:var(--shadow)}
.acct>svg{width:16px;height:16px;color:var(--mute)}
.pop{position:absolute;top:calc(100% + 10px);right:0;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:8px;z-index:70;min-width:250px;display:none;animation:pop .15s}
.pop.open{display:block}
.pop .ph{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.pop .ph b{display:block}.pop .ph small{color:var(--mute)}
button.pi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 10px;border-radius:11px;font-weight:700;font-size:.9rem;text-align:left}
button.pi:hover{background:var(--f-soft)}
button.pi svg{width:17px;height:17px;color:var(--mute);flex:none}
#notifPop{width:320px}
.ntf{display:flex;gap:11px;padding:10px;border-radius:12px}
.ntf:hover{background:var(--f-soft)}
.ntf .ni2{width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--f-soft)}
.ntf .ni2 img{width:22px;height:22px;object-fit:contain}
.ntf b{display:block;font-size:.86rem}.ntf small{color:var(--mute);font-size:.78rem}

/* ============ banner ============ */
.banner{display:flex;align-items:center;gap:10px;border-radius:var(--r-lg);padding:20px 22px;margin-bottom:18px;background:linear-gradient(100deg,#ffe3ef 0%,#eae3ff 48%,#ffe9d8 100%);box-shadow:var(--shadow);position:relative;overflow:hidden;animation:fadeUp .35s}
:root[data-theme="dark"] .banner{background:linear-gradient(100deg,#43264d 0%,#2b2257 55%,#1f1a45 100%)}
.bq{flex:1;min-width:0}
.bq .lab{display:flex;align-items:center;gap:7px;font-size:.82rem;font-weight:800}
:root[data-theme="dark"] .bq .lab{color:#f3d9ff}
.bq .lab svg{width:17px;height:17px;color:var(--gold)}
.bq p{margin-top:6px;font-size:clamp(1.05rem,1.8vw,1.3rem);font-weight:800;line-height:1.35;max-width:560px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
:root[data-theme="dark"] .bq p{color:#f1efff}
.bq p span{font-weight:700;font-size:.85em;opacity:.7}
.bmas{flex:none;width:168px;align-self:flex-end;margin-bottom:-8px;pointer-events:none}
.bmas img{width:100%;display:block;filter:drop-shadow(0 10px 14px rgba(120,80,180,.3))}
.bgo{flex:none;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow-lg);max-width:280px}
.bgo b{display:block;font-size:.98rem}
.bgo small{display:block;color:var(--mute);font-size:.78rem;font-weight:700;line-height:1.35}
.bgo .go{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--f-soft);display:grid;place-items:center}
.bgo .go svg{width:18px;height:18px;color:var(--f);transition:transform .2s}
.bgo .go:hover svg{transform:translateX(3px)}

/* ============ stats ============ */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.stat{display:flex;align-items:center;gap:13px;padding:16px 18px;animation:fadeUp .35s}
.stat:nth-child(2){animation-delay:.05s}.stat:nth-child(3){animation-delay:.1s}.stat:nth-child(4){animation-delay:.15s}
.sic{width:50px;height:50px;flex:none;border-radius:15px;display:grid;place-items:center}
.sic img{width:30px;height:30px;object-fit:contain}
.stat b{display:block;font-size:1.35rem;font-weight:900;line-height:1.2}
.stat span{font-size:.8rem;color:var(--mute);font-weight:700}

/* ============ home grid ============ */
.home{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(350px,470px);gap:16px;align-items:start}
.lcol,.rcol{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
.card{padding:19px 20px}
.card>.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card>.hd h3{font-size:1.02rem;font-weight:800;display:flex;align-items:center;gap:9px}
.card>.hd h3 svg{width:19px;height:19px;color:var(--f)}
.card>.hd .end{margin-left:auto;font-weight:800;font-size:.9rem;color:var(--mute)}
.linkbtn{border:0;background:none;color:var(--f);font-weight:800;font-size:.88rem;padding:4px 6px;border-radius:9px}
.linkbtn:hover{background:var(--f-soft)}
.hav{display:flex;align-items:center;gap:10px}
.hav .bav{width:46px;height:46px;flex:none;border-radius:14px;background:linear-gradient(160deg,#f3eaff,#ffe4ef);display:grid;place-items:center}
.hav .bav img{width:38px;height:38px;object-fit:contain}
.hav h3{font-size:1.05rem;font-weight:800}
.seg{display:flex;gap:7px;margin:4px 0 12px}
.seg i{flex:1;height:10px;border-radius:99px;background:color-mix(in srgb,var(--mute) 16%,transparent);transition:background .3s}
.seg i.on{background:var(--f)}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mute);font-size:.85rem;font-weight:700;flex-wrap:wrap}
.pfoot a{color:var(--f);font-weight:800;text-decoration:none;cursor:pointer}
.pfoot a:hover{text-decoration:underline}
.wkc{display:flex;justify-content:space-between;gap:6px;margin:12px 0 12px}
.wkc span{flex:1;max-width:44px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:.82rem;font-weight:800;background:color-mix(in srgb,var(--mute) 9%,transparent);color:var(--mute);cursor:pointer;border:2px solid transparent;transition:transform .15s}
.wkc span:hover{transform:scale(1.08)}
.wkc span.d{background:var(--f);color:#fff}
.wkc span.m{background:color-mix(in srgb,#ef4444 14%,var(--card));color:#ef4444}
.wkc span.c{background:var(--f);color:#fff;border-color:transparent}
.wkc span.c.d{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--f) 30%,transparent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.duo .card{margin:0}
.bigrow{display:flex;align-items:center;gap:12px;margin-top:8px}
.bigrow b{font-size:1.4rem;font-weight:900}
.bigrow .bar{flex:1}
.sub{color:var(--mute);font-size:.82rem;font-weight:700;margin-top:8px}
.mhd{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--f);font-size:.9rem;margin-bottom:8px}
.mhd svg{width:17px;height:17px}
.mrow{font-weight:800;font-size:.95rem}
textarea{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:11px 13px;font:inherit;font-weight:600;background:var(--bg);color:var(--ink);margin-top:8px;min-height:86px;resize:vertical}
.mini-moods{display:flex;gap:7px;align-items:center}
.mini-moods button,.moods7 button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:1.05rem;display:grid;place-items:center;padding:0;transition:transform .15s,border-color .2s,background .2s}
.mini-moods button:hover,.moods7 button:hover{transform:scale(1.12)}
.mini-moods button.on,.moods7 button.on{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 14%,var(--card))}
.saveRow{display:flex;justify-content:flex-end;margin-top:12px}
.btn{border:0;border-radius:12px;padding:10px 24px;background:var(--f);color:#fff;font-weight:800;font-size:.92rem;box-shadow:0 6px 16px color-mix(in srgb,var(--f) 35%,transparent);transition:transform .15s,filter .2s}
.btn svg{width:16px;height:16px;vertical-align:-3px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:none;color:var(--mute);border:1.5px solid var(--line);box-shadow:none}
/* habits */
.hb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:15px;padding:11px 12px;margin-bottom:10px;position:relative;transition:background .2s,border-color .2s}
.hb:last-child{margin-bottom:0}
.cb{flex:none;width:24px;height:24px;border-radius:8px;border:2.5px solid var(--f);background:var(--card);display:grid;place-items:center;color:#fff;padding:0}
.cb svg{width:14px;height:14px;opacity:0;transform:scale(.5);transition:.18s}
.hb.done,.dtask.done{background:color-mix(in srgb,var(--f) 7%,var(--card));border-color:color-mix(in srgb,var(--f) 35%,var(--line))}
.hb.done .cb,.dtask.done .cb{background:var(--f)}
.hb.done .cb svg,.dtask.done .cb svg{opacity:1;transform:scale(1)}
.dtask:disabled{opacity:.6;cursor:default}
.hb .hic{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.hb .hic img{width:26px;height:26px;object-fit:contain}
.hb .tx{flex:1;min-width:0}
.hb .tx b{font-size:.93rem}
.hb .tx .min{color:var(--mute);font-weight:700;font-size:.83rem}
.hb .tx p{color:var(--mute);font-size:.82rem;font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .kebab{flex:none;width:34px;height:34px;border:0;border-radius:10px;background:none;display:grid;place-items:center;color:var(--mute)}
.hb .kebab:hover{background:var(--f-soft);color:var(--f)}
.hb .kebab svg{width:18px;height:18px}
.hb.flash{animation:pop .4s}
.moods7{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 4px}
/* ============ tabs ============ */
.tabtitle{font-size:1.25rem;font-weight:900;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.tabtitle svg{width:22px;height:22px;color:var(--f)}
.cgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:9px}
.day{aspect-ratio:1;border-radius:13px;border:1.5px solid var(--line);background:var(--card);font:800 .95rem inherit;color:var(--ink);display:grid;place-content:center;text-align:center;padding:2px}
.day small{display:block;font-size:.58rem;font-weight:800;min-height:1em}
.day.done{background:var(--green);border-color:var(--green);color:#fff}
.day.cur{border-color:var(--f);box-shadow:0 0 0 4px color-mix(in srgb,var(--f) 22%,transparent);color:var(--f)}
.day.cur.done{color:#fff}
.day.miss{background:color-mix(in srgb,#ef4444 13%,var(--card));border-color:#ef4444;color:#ef4444}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);font-weight:700;margin-top:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font:700 .85rem inherit;color:var(--mute)}
.chip.on{background:var(--f);border-color:var(--f);color:#fff}
.wkhead{margin:20px 0 10px;font-size:.95rem;font-weight:800;color:var(--f)}
.wkhead:first-of-type{margin-top:4px}
.dcard{display:flex;gap:13px;width:100%;text-align:left;color:inherit;font:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;transition:box-shadow .2s,transform .15s}
.dcard:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.dcard .n{flex:none;width:46px;height:46px;border-radius:14px;background:var(--f);color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.05rem}
.dcard.done .n{background:var(--green)}
.dcard b{font-size:.98rem}
.dcard .ln{color:var(--mute);font-size:.83rem;margin-top:2px}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pg .card{margin:0}
.pg h3{font-size:.98rem;display:flex;align-items:center;gap:9px}
.pg h3 img{width:26px;height:26px;object-fit:contain}
.pg h3 span{margin-left:auto;color:var(--f);font-weight:900}
.badge{display:flex;gap:14px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.badge .ic{width:54px;height:54px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;background:color-mix(in srgb,var(--mute) 12%,transparent);filter:grayscale(1);opacity:.7}
.badge.on .ic{background:linear-gradient(135deg,#fbbf24,#f97316);filter:none;opacity:1}
.badge p{color:var(--mute);font-size:.84rem;margin-top:1px}
.rule{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px dashed var(--line)}
.rule:last-of-type{border-bottom:0}
.rule .ic{font-size:1.55rem;flex:none;width:46px;height:46px;border-radius:14px;background:var(--f-soft);display:grid;place-items:center}
.rule h3{font-size:1rem}
.rule p{color:var(--mute);font-size:.87rem;margin-top:2px}
.refl{padding:11px 0;border-bottom:1px dashed var(--line)}
.refl:last-child{border-bottom:0}
.refl p{color:var(--mute);font-size:.86rem;margin-top:2px}
/* ============ dialog ============ */
dialog{border:0;border-radius:20px;padding:0;max-width:min(560px,94vw);width:100%;background:var(--card);color:var(--ink);box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(20,16,50,.5);backdrop-filter:blur(3px)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 0}
.mh h2{font-size:1.15rem;font-weight:900}
.x{border:0;background:var(--f-soft);color:var(--ink);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.x svg{width:16px;height:16px}
.mb{padding:16px 20px 22px;max-height:min(70vh,620px);overflow:auto}
.mnote{border:1.5px dashed color-mix(in srgb,var(--pink) 50%,var(--line));background:color-mix(in srgb,var(--pink) 7%,var(--card));border-radius:13px;padding:11px 13px;font-weight:800;font-size:.9rem;margin-bottom:12px}
.label{font-size:.82rem;font-weight:800;color:var(--mute)}
.dtask{display:flex;gap:12px;align-items:flex-start;padding:11px;border-radius:14px;border:1px solid var(--line);margin-bottom:9px;cursor:pointer;background:var(--card);width:100%;text-align:left;color:inherit;font:inherit}
.dtask .cb{margin-top:2px}
.dtask small{color:var(--mute);font-weight:800;font-size:.78rem;display:flex;align-items:center;gap:6px}
.dtask small img{width:17px;height:17px;object-fit:contain}
.dtask p{margin-top:2px;font-size:.9rem}
/* ============ toast / misc ============ */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:grid;gap:8px;z-index:200}
.toast{background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-weight:800;font-size:.9rem;box-shadow:var(--shadow-lg);animation:fadeUp .25s}
.kebabMenu{position:fixed;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;z-index:150;min-width:190px;animation:pop .15s}
.flashHl{animation:pop .5s 2}
.hidden{display:none!important}
/* ============ responsive ============ */
#mobnav{display:none}
@media(max-width:1120px){
  .home{grid-template-columns:minmax(0,1fr)}
  .search{width:min(300px,38vw)}
}
@media(max-width:960px){
  #sidebar{display:none}
  .main{margin-left:0;padding:20px 16px calc(128px + env(safe-area-inset-bottom,0px))}
  #mobnav{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;gap:2px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:var(--shadow-lg);width:min(560px,calc(100% - 20px));justify-content:space-between}
  #mobnav button{flex:1;border:0;background:none;border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.6rem;font-weight:800;color:var(--mute)}
  #mobnav button svg{width:20px;height:20px}
  #mobnav button.on{background:var(--f-soft);color:var(--f)}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .duo{grid-template-columns:1fr}
  .cgrid{grid-template-columns:repeat(5,1fr)}
  .bmas{display:none}
  .pg{grid-template-columns:1fr}
  .search kbd{display:none}
  .search{width:min(46vw,260px)}
  .bgo{max-width:none}
}
@media(max-width:560px){
  html,body{overflow-x:hidden}
  .tools .search{display:none}
  .main{padding:16px 16px calc(128px + env(safe-area-inset-bottom,0px))}
  .topbar{margin-bottom:14px}
  .banner{flex-wrap:wrap;padding:16px;margin-bottom:14px}
  .bgo{width:100%}
  .hl h1{font-size:1.35rem}
  .tiles{gap:12px;margin-bottom:14px}
  .stat{padding:13px 14px}
  .home{gap:12px}
  .lcol,.rcol{gap:12px}
  .card{padding:15px 16px}
  .card>.hd{margin-bottom:10px}
  .duo{gap:12px}
  .seg{margin:4px 0 10px}
  .wkc{margin:10px 0}
  .bigrow{margin-top:6px}
  .sub{margin-top:6px}
  .mhd{margin-bottom:6px}
  textarea{min-height:64px;margin-top:6px;padding:9px 12px}
  .mini-moods{gap:6px}
  .moods7{gap:6px;margin:10px 0 2px}
  .mini-moods button,.moods7 button{width:36px;height:36px}
  .saveRow{margin-top:8px}
  .hb{padding:10px 11px;margin-bottom:8px}
  .hb .tx p{white-space:normal;overflow:visible;text-overflow:clip}
  .toast{max-width:calc(100vw - 28px)}
}
</style>
</head>

const KEY="ch60v1";
let S={start:null,done:{},notes:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/864e5};
if(!S.start){S.start=today();save()}
const cur=()=>Math.min(60,Math.max(1,Math.floor(today()-S.start)+1));
const wkOf=n=>Math.min(8,Math.floor((n-1)/7));
const taskText=(n,i)=>{const d=D[n-1];if(i<4)return d[i]||"Self-care.";return d[4]||"Tick today's checklist and write your reflection."};
const isDone=(n,k)=>!!(S.done[n]&&S.done[n][k]);
const full=n=>H.every(h=>isDone(n,h.k));
const doneCount=()=>{let c=0;for(let i=1;i<=60;i++)if(full(i))c++;return c};
function streaks(){let best=0,run=0;for(let i=1;i<=60;i++){if(full(i)){run++;best=Math.max(best,run)}else run=0}
  const c=cur();let s=0,i=full(c)?c:c-1;while(i>=1&&full(i)){s++;i--}return{s,best}}
const status=n=>{const c=cur();if(full(n))return"done";if(n===c)return"cur";if(n<c)return"miss";return"up"};
const hprog=k=>{let c=0;for(let i=1;i<=60;i++)if(isDone(i,k))c++;return c};
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const $=id=>document.getElementById(id);

function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;$("toasts").appendChild(t);setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s"},1500);setTimeout(()=>t.remove(),1850)}
function toggleHabit(n,k){
  S.done[n]=S.done[n]||{};S.done[n][k]=!S.done[n][k];const was=full(n);save();
  if(full(n)&&!was)toast("Day "+n+" complete! 🎉");
}
const xpTotal=()=>{let x=0;for(let n=1;n<=60;n++)H.forEach(h=>{if(isDone(n,h.k))x+=h.m});return x};

let openDay=null;
function dayView(n){
  const ed=n<=cur();const nt=S.notes[n]||{};const d=D[n-1];const tot=H.filter(h=>isDone(n,h.k)).length;
  return `${d[5]?`<div class="mnote">🪞 ${esc(d[5])}</div>`:""}`
    + H.map((h,i)=>`<button class="dtask ${isDone(n,h.k)?"done":""}" data-n="${n}" data-k="${h.k}" ${ed?"":"disabled"}>
        <span class="cb">${isDone(n,h.k)?I.check:""}</span>
        <span><small><img src="${ASSETS[h.ic]}" alt="">${h.n} · ${h.m} min</small><p>${esc(taskText(n,i))}</p></span></button>`).join("")
    + `<div class="bar" style="--k:var(--green);margin:14px 0 8px"><i style="width:${tot*25}%"></i></div>
       <p class="sub">${tot}/4 tasks done${ed?"":" · unlocks on Day "+n}</p>`
    + (ed?`<h3 style="margin:16px 0 0;font-size:1rem">Daily reflection</h3>
       <span class="label">What I learned today</span>
       <textarea data-r="learn" data-n="${n}" placeholder="Write your thoughts...">${esc(nt.learn||"")}</textarea>
       <span class="label">How I felt today</span>
       <div class="moods7" style="margin-top:8px">${MOODS5.map(m=>`<button data-mood="${m}" data-n="${n}" class="${nt.mood===m?"on":""}" aria-label="Mood ${m}">${m}</button>`).join("")}</div>
       <span class="label" style="display:block;margin-top:10px">Optional short note</span>
       <textarea data-r="note" data-n="${n}" placeholder="Add a note...">${esc(nt.note||"")}</textarea>`:"");
}
function showDay(n,keep){
  openDay=n;
  $("dT").textContent=`Day ${n} · ${WEEKS[wkOf(n)].split(" — ")[0]}`;
  $("dB").innerHTML=dayView(n);
  if(!keep&&!$("dlg").open)$("dlg").showModal();
}
$("dX").onclick=()=>$("dlg").close();
$("dlg").addEventListener("close",()=>{openDay=null;render()});
$("dB").onclick=e=>{
  const t=e.target.closest(".dtask");
  if(t&&!t.disabled){toggleHabit(+t.dataset.n,t.dataset.k);$("dB").innerHTML=dayView(+t.dataset.n);return}
  const m=e.target.closest("[data-mood]");
  if(m){const n=m.dataset.n;S.notes[n]=S.notes[n]||{};S.notes[n].mood=S.notes[n].mood===m.dataset.mood?null:m.dataset.mood;save();
    [...m.parentNode.children].forEach(b=>b.classList.toggle("on",b.dataset.mood===S.notes[n].mood))}
};
$("dB").oninput=e=>{const r=e.target.dataset.r;if(r){const n=e.target.dataset.n;S.notes[n]=S.notes[n]||{};S.notes[n][r]=e.target.value;save()}};

  <div class="pg">
    ${H.map(x=>{const v=hprog(x.k);return `<section class="card"><h3><img src="${ASSETS[x.ic]}" alt="">${esc(x.n)}<span>${v}/60</span></h3><div class="bar" style="--k:${x.c};margin-top:11px"><i style="width:${v/60*100}%"></i></div><p class="sub">${x.m} min a day · ${Math.round(v/60*100)}%</p></section>`}).join("")}
    <section class="card"><h3 style="font-weight:800">🔥 Streak</h3><p class="sub" style="margin-top:8px">Current: <b style="color:var(--ink)">${s} days</b> · Best: <b style="color:var(--ink)">${best} days</b></p></section>
    <section class="card"><h3 style="font-weight:800">⚡ Level ${lv} · ${LT[Math.min(lv-1,5)]}</h3><div class="bar" style="--k:var(--green);margin-top:11px"><i style="width:${xp%300/3}%"></i></div><p class="sub">${xp} XP · 1 minute done = 1 XP · ${300-xp%300} XP to next level</p></section>
    <section class="card"><h3 style="font-weight:800">🏁 Challenge</h3><div class="bigrow"><b>${p}%</b><div class="bar"><i style="width:${p}%"></i></div></div><p class="sub">${dc}/60 days complete</p></section>
  </div>
  <section class="card" style="margin-top:16px"><h3 style="font-weight:800;margin-bottom:6px">Reflections</h3>
    ${refl||`<p class="sub">No reflections yet. Write one on today's page.</p>`}
  </section>
  <div style="margin-top:16px"><button class="btn ghost" id="resetBtn">${I.reset.replace('width="2"','width="2.2"')} Reset all progress</button></div>`;
}
function awardsHTML(){
  const dc=doneCount(),{s,best}=streaks();
  const AWR=[["🏆","First day completed",dc>=1],["🔥","7-day streak",best>=7],["🌱","15-day progress",dc>=15],["🚀","30-day progress",dc>=30],["💪","45-day progress",dc>=45],["🏆","60-day completion",dc>=60]];
  return `<h2 class="tabtitle">${I.trophy} Awards</h2>
  <section class="card">
    <p class="sub" style="margin-bottom:14px">🔥 Streak: <b style="color:var(--ink)">${s}</b> · Best: <b style="color:var(--ink)">${best}</b></p>
    ${AWR.map(a=>`<div class="badge ${a[2]?"on":""}"><div class="ic">${a[0]}</div><div><b>${a[1]}</b><p>${a[2]?"Unlocked! 🎉":"Keep showing up"}</p></div></div>`).join("")}
  </section>`;
}
function rulesHTML(){
  return `<h2 class="tabtitle">${I.doc} My Goals 🎯</h2>
  <p class="sub" style="margin:-8px 0 14px">What I want to improve during my 60-Day Level-Up Challenge.</p>
  <section class="card">
    ${RULES.map((r,i)=>`<div class="rule"><span class="ic">${r[0]}</span><div><h3>${i+1}. ${esc(r[1])}</h3><p>${esc(r[2])}</p></div></div>`).join("")}
    <p style="font-weight:800;color:var(--f);margin:16px 0 4px">🏆 By Day 60, I Want To Be Able To...</p>
    ${BY60.map(b=>`<div class="rule"><span class="ic">✅</span><div><h3 style="font-size:.95rem">${esc(b)}</h3></div></div>`).join("")}
    <p style="font-weight:800;color:var(--f);margin-top:14px">Don't try to become perfect in 60 days. Just become a little better every day.</p>
  </section>`;
}

/* ============================================================
   render
============================================================ */
function render(){
  nav();
  const c=cur();
  $("heroSub").textContent=`60-Day Challenge · Day ${c} of 60`;
  const q=DQ[Math.floor(today())%DQ.length];
  const M=$("main");
  if(tab==="home"){
    M.innerHTML=homeHTML();
    const qp=$("quoteP");qp.innerHTML=`“${esc(q[0])}” <span>— ${esc(q[1])}</span>`;
  }
  else if(tab==="cal")M.innerHTML=calHTML();
  else if(tab==="plan")M.innerHTML=planHTML();
  else if(tab==="prog")M.innerHTML=progHTML();
  else if(tab==="awards")M.innerHTML=awardsHTML();
  else M.innerHTML=rulesHTML();
  renderBellDot();
}

/* main click delegation */
$("main").addEventListener("click",e=>{
  const navb=e.target.closest("[data-t]");
  const d=e.target.closest("[data-d]");
  const f=e.target.closest("[data-f]");
  const act=e.target.closest("[data-act]");
  const hm=e.target.closest("[data-hmood]");
  const kb=e.target.closest("[data-kebab]");
  const rb=e.target.closest("#resetBtn");

  if(navb){tab=navb.dataset.t;render();window.scrollTo({top:0});return}
  if(f){filter=f.dataset.f;render();return}
  if(d){showDay(+d.dataset.d);return}
  if(rb){if(confirm("Erase all progress and notes?")){S={start:today(),done:{},notes:{}};save();render();toast("Progress reset")}return}
  if(act){
    if(act.dataset.act==="viewall"){tab="plan";render();window.scrollTo({top:0})}
    if(act.dataset.act==="next"){const nx=H.find(x=>!isDone(cur(),x.k));nx?showDay(cur()):toast("All done for today! 🎉")}
    return;
  }
  if(kb){openKebab(kb);return}
  if(hm){const n=cur();S.notes[n]=S.notes[n]||{};S.notes[n].mood=S.notes[n].mood===hm.dataset.hmood?null:hm.dataset.hmood;save();
    document.querySelectorAll("[data-hmood]").forEach(b=>b.classList.toggle("on",b.dataset.hmood===S.notes[n].mood));return}
  const hb=e.target.closest(".hb");
  if(hb&&!kb){toggleHabit(cur(),hb.dataset.k);const y=window.scrollY;render();window.scrollTo(0,y)}
});
/* reflection save + inputs */
$("main").addEventListener("input",e=>{
  const r=e.target.dataset.r;if(!r)return;const n=e.target.dataset.n;
  S.notes[n]=S.notes[n]||{};S.notes[n][r]=e.target.value;save();
});
$("main").addEventListener("click",e=>{
  if(e.target.id==="saveBtn")toast("Reflection saved ✓");
});
/* keyboard toggling of habit rows */
$("main").addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("hb")){e.preventDefault();toggleHabit(cur(),e.target.dataset.k);render()}
});

/* go-to-next arrow */
document.addEventListener("click",e=>{
  if(e.target.closest("#goBtn")){const nx=H.find(x=>!isDone(cur(),x.k));nx?showDay(cur()):toast("All done for today! 🎉")}
});

/* ============================================================
   kebab menu
============================================================ */
function closeKebab(){const m=$("kebabMenu");if(m)m.remove();document.removeEventListener("click",kebabAway,true)}
function kebabAway(e){if(!e.target.closest(".kebabMenu"))closeKebab()}
function openKebab(btn){
  closeKebab();
  const k=btn.dataset.kebab;const h=H.find(x=>x.k===k);const c=cur();
  const done=isDone(c,k);
  const m=document.createElement("div");m.className="kebabMenu";m.id="kebabMenu";
  m.innerHTML=`
    <button class="pi" data-km="toggle">${done?"↩︎ Mark as not done":"✓ Mark as done"}</button>
    <button class="pi" data-km="day">${I.cal} Open Day ${c}</button>`;
  document.body.appendChild(m);
  const r=btn.getBoundingClientRect();
  m.style.top=Math.min(window.innerHeight-m.offsetHeight-10,r.bottom+6)+"px";
  m.style.left=Math.min(window.innerWidth-m.offsetWidth-10,Math.max(10,r.right-m.offsetWidth))+"px";
  m.addEventListener("click",e=>{
    const a=e.target.closest("[data-km]");if(!a)return;
    if(a.dataset.km==="toggle"){toggleHabit(c,k);closeKebab();render()}
    else{closeKebab();showDay(c)}
  });
  setTimeout(()=>document.addEventListener("click",kebabAway,true),0);
}

/* ============================================================
   notifications + account
============================================================ */
const NOTIF_KEY="ch30notifread";
function notifData(){
  const c=cur(),dc=doneCount(),{s}=streaks();
  const MS=[["First day completed",dc,1],["7-day streak",streaks().best,7],["15-day progress",dc,15],["30-day progress",dc,30],["45-day progress",dc,45],["60-day completion",dc,60]];
  const nm=MS.find(m=>m[1]<m[2]);
  const items=[];
  items.push(full(c)
    ?{ic:"icons/medal.png",t:`Day ${c} complete! 🎉`,d:"All 4 habits done — see you tomorrow."}
    :{ic:"icons/stopwatch.png",t:`Day ${c} is live`,d:`${H.filter(x=>!isDone(c,x.k)).length} habits left · ${H.reduce((a,x)=>a+(isDone(c,x.k)?0:x.m),0)} minutes to go.`});
  if(!full(c)&&status(c-1||1)==="miss"&&c>1)items.push({ic:"icons/sprout.png",t:"Missed a day? Never restart.",d:"Just continue today — tiny versions count."});
  items.push({ic:"icons/flame.png",t:`Streak: ${s} day${s===1?"":"s"}`,d:s?"Keep the chain alive.":"Complete Day "+c+" to start a streak."});
  if(nm)items.push({ic:"icons/target.png",t:`Next milestone: ${nm[0]}`,d:`${nm[1]}/${nm[2]} — keep showing up.`});
  return items;
}
function renderBellDot(){
  let rd=true;try{rd=localStorage.getItem(NOTIF_KEY)!=="1"}catch(e){}
  $("bellDot").style.display=rd?"block":"none";
}
$("bellBtn").addEventListener("click",e=>{
  e.stopPropagation();
  const p=$("notifPop");const wasOpen=p.classList.contains("open");
  closePops();
  if(wasOpen)return;
  p.innerHTML=`<div class="ph"><b>Notifications</b><small>You're doing great, Tamil 💪</small></div>`
    +notifData().map(n=>`<div class="ntf"><span class="ni2"><img src="${ASSETS[n.ic]}" alt=""></span><div><b>${esc(n.t)}</b><small>${esc(n.d)}</small></div></div>`).join("");
  p.classList.add("open");
  try{localStorage.setItem(NOTIF_KEY,"1")}catch(e){}
  renderBellDot();
});
function acctHTML(){
  const dark=document.documentElement.dataset.theme==="dark";
  return `<div class="ph"><b>Tamil</b><small>Level-Up · 60-Day Challenge</small></div>
  <button class="pi" data-acct="theme">${dark?I.sun+" Light mode":I.moon+" Dark mode"}</button>
  <button class="pi" data-acct="reset">${I.reset} Reset all progress</button>`;
}
$("avatarBtn").addEventListener("click",e=>{
  e.stopPropagation();
  const p=$("acctPop");const wasOpen=p.classList.contains("open");
  closePops();
  if(wasOpen)return;
  p.innerHTML=acctHTML();p.classList.add("open");
});
$("acctPop").addEventListener("click",e=>{
  const b=e.target.closest("[data-acct]");if(!b)return;
  if(b.dataset.acct==="theme")toggleTheme();
  if(b.dataset.acct==="reset"&&confirm("Erase all progress and notes?")){S={start:today(),done:{},notes:{}};save();render();toast("Progress reset")}
  closePops();
});
function closePops(){document.querySelectorAll(".pop.open").forEach(p=>p.classList.remove("open"))}
document.addEventListener("click",e=>{if(!e.target.closest(".pop")&&!e.target.closest("#bellBtn")&&!e.target.closest("#acct"))closePops()});

/* ============================================================
   search
============================================================ */
const sIn=$("searchInput"),sRes=$("sres");
function buildIndex(){
  const idx=[];
  for(let n=1;n<=60;n++)idx.push({t:"Day "+n,d:WEEKS[wkOf(n)]+" · "+[0,1,2,3].map(i=>taskText(n,i)).join(" "),ic:I.cal,run:()=>showDay(n)});
  H.forEach(h=>idx.push({t:h.n,d:h.m+" min a day · today's habit",img:ASSETS[h.ic],run:()=>{tab="home";render();const row=document.querySelector(`.hb[data-k="${h.k}"]`);if(row){row.classList.add("flashHl");row.scrollIntoView({block:"center",behavior:"smooth"})}}}));
  Object.keys(S.notes).forEach(n=>{const o=S.notes[n];const txt=[o.learn,o.note].filter(Boolean).join(" ");if(txt)idx.push({t:"Note · Day "+n,d:txt.slice(0,70),ic:I.book,run:()=>showDay(+n)})});
  return idx;
}
function runSearch(){
  const q=sIn.value.trim().toLowerCase();
  if(!q){sRes.classList.remove("open");sRes.innerHTML="";return}
  const idx=buildIndex();
  const hits=idx.filter(x=>(x.t+" "+x.d).toLowerCase().includes(q)).slice(0,7);
  sRes.innerHTML=hits.length
    ?hits.map((h,i)=>`<button data-si="${i}"><span class="si">${h.img?`<img src="${h.img}" alt="">`:h.ic}</span><span><b>${esc(h.t)}</b><small>${esc(h.d)}</small></span></button>`).join("")
    :`<div class="none">No matches for “${esc(q)}”</div>`;
  sRes._hits=hits;
  sRes.classList.add("open");
}
sIn.addEventListener("input",runSearch);
sIn.addEventListener("focus",runSearch);
sIn.addEventListener("keydown",e=>{
  if(e.key==="Enter"){const h=sRes._hits&&sRes._hits[0];if(h){sRes.classList.remove("open");sIn.blur();h.run()}}
  if(e.key==="Escape"){sRes.classList.remove("open");sIn.blur()}
});
sRes.addEventListener("mousedown",e=>{
  const b=e.target.closest("[data-si]");if(!b)return;e.preventDefault();
  const h=sRes._hits[+b.dataset.si];sRes.classList.remove("open");sIn.value="";sIn.blur();h.run();
});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))sRes.classList.remove("open")});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();sIn.focus();sIn.select()}
});

/* ============================================================
   boot
============================================================ */
render();
</script>
